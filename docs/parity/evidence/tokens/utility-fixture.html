<!DOCTYPE html>
<html lang="en" data-system="editorial" data-accent="crimson">
<head><meta charset="utf-8"><title>utility fixture</title><link rel="stylesheet" href="__CSS__"></head>
<body>
<div class="page" style="padding:40px">
  <div id="row" style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
    <span class="chip" id="chip">chip</span>
    <span class="chip accent" id="chip-accent">accent</span>
    <span class="chip ok" id="chip-ok">ok</span>
    <span class="chip warn" id="chip-warn">warn</span>
    <span class="chip bad" id="chip-bad">bad</span>
    <span class="chip muted" id="chip-muted">muted</span>
    <span class="dot ok" id="dot-ok"></span><span class="dot warn" id="dot-warn"></span><span class="dot bad" id="dot-bad"></span>
    <span class="mono" id="mono">mono 0123</span>
    <span class="eyebrow" id="eyebrow">Eyebrow</span>
    <span class="kbd" id="kbd">⌘K</span>
    <span class="hide-mobile" id="hide-mobile">hide-mobile</span>
    <span class="hide-tablet" id="hide-tablet">hide-tablet</span>
    <span class="show-tablet" id="show-tablet">show-tablet</span>
  </div>
  <div class="card" id="card" style="margin-top:24px;max-width:360px;padding:20px">
    <div class="eyebrow">Card</div>
    <div class="display-h" id="display-h" style="font-size:24px">Display heading</div>
    <p style="color:var(--text-2)">Body copy inside a canonical card.</p>
  </div>
  <div class="card hoverable" id="card-hoverable" style="margin-top:16px;max-width:360px;padding:20px">hoverable card</div>
</div>
</body></html>
