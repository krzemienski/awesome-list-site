              search
            type: string
            maxLength: 512
        - name: search
          in: query
          required: false
          schema:
            description: Alias for q; wins when both are sent
            type: string
            maxLength: 512
        - name: category
          in: query
          required: false
          schema:
            description: Category display name or URL slug
            type: string
            maxLength: 512
        - name: subcategory
          in: query
          required: false
          schema:
            description: Subcategory display name or URL slug (resolved globally when category is absent)
            type: string
            maxLength: 512
        - name: subSubcategory
          in: query
          required: false
          schema:
            description: Sub-subcategory display name
            type: string
            maxLength: 512
        - name: generalScope
          in: query
          required: false
          schema:
            description: Restrict to resources filed directly at that level (no deeper taxonomy)
            type: string
            enum:
              - category
              - subcategory
        - name: tags
          in: query
          required: false
          schema:
            description: Comma-separated or repeated tags
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: tag
          in: query
          required: false
          schema:
            description: Alias for tags; combines with tags
            anyOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: provider
          in: query
          required: false
          schema:
            description: >-
              Case-insensitive; one of: unknown, self-hosted, github, youtube, vimeo, aws, google-cloud, azure,
              cloudflare, mux, akamai, wowza, brightcove, bitmovin, other. Other values answer 400 invalid_provider with
              allowed[]
            type: string
            maxLength: 512
        - name: format
          in: query
          required: false
          schema:
            description: >-
              Case-insensitive; one of: unknown, tool, library, player, sdk, api-service, platform, course, article,
              video, book, specification, dataset, community, other. Other values answer 400 invalid_format with
              allowed[]
            type: string
            maxLength: 512
        - name: skillLevel
          in: query
          required: false
          schema:
            description: >-
              Case-insensitive; one of: unknown, beginner, intermediate, advanced, all-levels. Other values answer 400
              invalid_skillLevel with allowed[]
            type: string
            maxLength: 512
        - name: kind
          in: query
          required: false
          schema:
            description: >-
              Case-insensitive; one of: tools, libraries, standards, events, protocols, other. Other values answer 400
              invalid_kind with allowed[]
            type: string
            maxLength: 512
        - name: sort
          in: query
          required: false
          schema:
            description: Other values return 400 invalid_sort
            type: string
            enum:
              - relevance
              - name-asc
              - name-desc
              - newest
              - oldest
        - name: facets
          in: query
          required: false
          schema:
            description: true adds provider/format/skillLevel/kind facet counts to the response
            type: string
            enum:
              - 'true'
              - 'false'
        - name: status
          in: query
          required: false
          schema:
            description: Default approved; other statuses require admin
            type: string
            enum:
              - approved
              - pending
              - rejected
        - name: page
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d+$
            description: Integer from 1 to 2147483647
        - name: limit
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d+$
            description: Integer from 1 to 100
        - name: offset
          in: query
          required: false
          schema:
            type: string
            pattern: ^\d+$
            description: Integer from 0 to 2147483647
        - name: cursor
          in: query
          required: false
          schema:
            description: Alias for offset; offset takes precedence
            type: string
            pattern: ^\d+$
