    <script>
      // BUG-021 (run24): strip query params carrying real markup payloads from
      // the address bar BEFORE any other boot script runs. The app never
      // renders raw query strings as HTML, but the payload sat in the URL bar
      // (shareable/copyable) and flowed into analytics page_path. Runs
      // pre-React via replaceState so no history entry keeps the payload.
      //
      // ONE coherent policy (audit2 BUG-009): scrub ONLY strings that could
      // parse as actual HTML markup if injected raw — a tag-open sequence.
      // Per the HTML5 tokenizer, "<" starts markup only when immediately
      // followed by a letter, "/", "!" or "?", so prose like "a < b > c" or
      // "javascript: the good parts" is plain text and searches normally.
      // Bare scheme/attribute text (javascript:, onerror=, data:text/html) is
      // inert without a markup context: every reflection sink HTML-escapes
      // (React text nodes + the server-rendered fallback), and query text is
      // never assigned to href/src — so it is no longer scrubbed.
      //
      // audit2 BUG-024: the check runs across RECURSIVE percent-decodings
      // (URLSearchParams already decoded once; loop up to 5 more passes) so
      // double-/triple-encoded payloads (%253Cscript…) can't slip through.
      (function () {
        try {
          if (!location.search || location.search.length < 2) return;
          var MARKUP = /<[a-z!\/?]/i;
          var params = new URLSearchParams(location.search);
          var dirty = false;
          var names = [];
          var removed = [];
          params.forEach(function (v, k) { names.push(k); });
          for (var i = 0; i < names.length; i++) {
            var k = names[i];
            var probe = k + '=' + (params.get(k) || '');
            var hit = MARKUP.test(probe);
            for (var d = 0; d < 5 && !hit; d++) {
              var next;
              try { next = decodeURIComponent(probe); } catch (_) { break; }
              if (next === probe) break;
              probe = next;
              hit = MARKUP.test(probe);
            }
            if (hit) {
              params.delete(k);
              if (removed.indexOf(k) === -1) removed.push(k);
              dirty = true;
            }
          }
          if (dirty) {
            // BUG-032/BUG-064 (run27): stripping is the right security call,
            // but doing it SILENTLY made /search?q=<img…> render the full
            // catalog and /?tags=<script>… render unfiltered with no hint the
            // link was altered. Record what was dropped so the app can show
            // an explicit "part of this link was ignored" notice after boot.
            window.__scrubbedParams = removed;
            var qs = params.toString();
            history.replaceState(
              history.state,
              '',
              location.pathname + (qs ? '?' + qs : '') + location.hash
            );
          }
        } catch (e) {}
      })();
    </script>

    <script>
      (function () {
        try {
          // Vite replaces this marker from THEME_FALLBACK_REGISTRY-derived
          // data before serving/building the HTML. Keeping the script inline
          // preserves the current no-flash behavior without a second network
          // request or a hand-maintained list of theme ids.
          var THEME_BOOT = __AWESOME_VIDEO_THEME_BOOT__;
          var PRODUCT_PROFILE_BOOT = __AWESOME_VIDEO_PRODUCT_PROFILE_BOOT__;
          var sys = null, acc = null;
          try { sys = localStorage.getItem('ds-system'); } catch (_) {}
          try { acc = localStorage.getItem('ds-accent'); } catch (_) {}
          var root = document.documentElement;
          var profile = new RegExp(PRODUCT_PROFILE_BOOT.routePatterns.admin).test(location.pathname)
            ? 'admin-operations'
            : new RegExp(PRODUCT_PROFILE_BOOT.routePatterns.learning).test(location.pathname)
              ? 'learning-workspace'
              : 'public-discovery';
          var profileDefaults = PRODUCT_PROFILE_BOOT.profiles[profile];
          if (THEME_BOOT.systems.indexOf(sys) === -1) {
            sys = profileDefaults ? profileDefaults.defaultSystem : THEME_BOOT.defaultSystem;
          }
          if (THEME_BOOT.accents.indexOf(acc)  === -1) {
            acc = profileDefaults ? profileDefaults.defaultAccent : THEME_BOOT.defaultAccent;
          }
          root.setAttribute('data-product-profile', profile);
          root.setAttribute('data-system', sys);
          root.setAttribute('data-accent', acc);
          root.classList.add('dark');
          root.style.backgroundColor = '#000';

          // I1 — font override: read ds-font-override from localStorage and
          // apply --font-sans pre-paint on EVERY route, so the override
          // persists across hard reloads regardless of which page boots.
          // Vite replaces this marker from FONT_OPTIONS-derived data before
          // serving/building the HTML. Keeping it inline preserves the
          // current no-flash behavior without a second network request or a
          // hand-maintained list of font ids and stacks.
          var FONT_BOOT = __AWESOME_VIDEO_FONT_BOOT__;
          var fnt = null;
          try { fnt = localStorage.getItem('ds-font-override'); } catch (_) {}
          if (!Object.prototype.hasOwnProperty.call(FONT_BOOT.stacks, fnt)) fnt = FONT_BOOT.fallback;
          root.setAttribute('data-font', fnt);
          if (fnt && FONT_BOOT.stacks[fnt]) {
            // Run22 BUG-015: body text uses --font-body (not --font-sans);
            // set both, matching applyFontOverride in font-options.ts.
            root.style.setProperty('--font-body', FONT_BOOT.stacks[fnt]);
            root.style.setProperty('--font-sans', FONT_BOOT.stacks[fnt]);
          }
           // Font assets remain optional until after the first paint. The app
           // applies a selected picker font and system display font on idle.
        } catch (e) {}
      })();
    </script>

    <script>
      // BUG-001 (run19): kick off the awesome-list fetch before the JS bundle
      // is even parsed. fetchStaticAwesomeList() consumes this promise (one
      // shot) so warm loads don't serialize bundle-parse -> fetch. The catch
      // only silences unhandled-rejection noise; consumers handle errors.
      (function () {
          // The nav tree (~few KB) is needed by chrome on every page. Default
          // taxonomy views prefetch one 24-card listing slice; the full corpus
          // remains reserved for Advanced browse and taxonomy filter modes.
        try {
          var n = fetch('/api/awesome-list/nav', { credentials: 'same-origin' });
          window.__awesomeListNavEarlyFetch = n;
          n.catch(function () {});
        } catch (e) {}
        try {
          var pth = location.pathname;
          var taxonomyMatch = pth.match(/^\/(category|subcategory|sub-subcategory)\/([^/]+)$/);
          var tagMatch = pth.match(/^\/tag\/([^/]+)$/);
          var searchParams = new URLSearchParams(location.search);
          var needsCorpus = pth === '/advanced' || (
            !!taxonomyMatch &&
            (!!searchParams.get('search') || !!searchParams.get('tags') || !!searchParams.get('tag') ||
             !!searchParams.get('sortBy') || !!searchParams.get('sort'))
          );
          if (needsCorpus) {
            var p = fetch('/api/awesome-list', { credentials: 'same-origin' });
            window.__awesomeListEarlyFetch = p;
            p.catch(function () {});
          } else if (tagMatch) {
            var tagPage = searchParams.get('page') || '1';
            if (/^[1-9]\d*$/.test(tagPage)) {
              var tagOffset = (Number(tagPage) - 1) * 24;
              var tagUrl = '/api/resources?tags=' + encodeURIComponent(decodeURIComponent(tagMatch[1])) + '&limit=24&offset=' + tagOffset + '&facets=true';
              var tagFetch = fetch(tagUrl, { credentials: 'same-origin' });
              window.__tagListingEarlyFetch = { url: tagUrl, promise: tagFetch };
              tagFetch.catch(function () {});
            }
          } else if (taxonomyMatch) {
            var level = taxonomyMatch[1] === 'sub-subcategory' ? 'sub-subcategory' : taxonomyMatch[1];
            var page = searchParams.get('page');
            if (!page || /^[1-9]\d*$/.test(page)) {
              var listingParams = new URLSearchParams({ level: level, slug: decodeURIComponent(taxonomyMatch[2]), page: page || '1' });
              var subcategory = searchParams.get('subcategory');
              if (subcategory) {
                if (level === 'category' && subcategory.indexOf(' › ') !== -1) {
                  var pieces = subcategory.split(' › ');
                  listingParams.set('subcategory', pieces[0]);
                  listingParams.set('subSubcategory', pieces[1]);
                } else {
                  listingParams.set('subcategory', subcategory);
                }
              }
              if (searchParams.get('filter') === 'general' || searchParams.get('view') === 'general') listingParams.set('general', '1');
              var listingUrl = '/api/awesome-list/listing?' + listingParams.toString();
              var listingPromise = fetch(listingUrl, { credentials: 'same-origin' });
              window.__awesomeListListingEarlyFetch = { url: listingUrl, promise: listingPromise };
              listingPromise.catch(function () {});
            }
          }
        } catch (e) {}
        // Task #307: the Task-169 auth early-fetch was removed — the Clerk
        // SDK must initialize before auth state is meaningful, so a pre-boot
        // /api/auth/user snapshot could only go stale.
      })();
    </script>

    <script>
      (function () {
        try {
          var isDev = location.hostname.endsWith('.replit.dev') ||
                      location.hostname === 'localhost' ||
                      location.hostname.endsWith('.repl.co');
          if (!isDev) return;

          // Narrow regex: only match the specific Vite/HMR rejection
          // signatures that drive the overlay loop. Avoid bare "fetch" or
          // "vite" tokens so real app errors (incl. words like "invite"
          // or React Query fetch failures) still surface in dev consoles.
          var noisy = /(?:^|\b)(?:Load failed|Failed to fetch dynamically imported module|WebSocket (?:is closed|connection failed|error)|\[vite\]|vite-hmr|HMR connection lost)(?:\b|$)/i;
          var stackHit = /\/@vite\/client|\/node_modules\/vite\//;

          window.addEventListener('unhandledrejection', function (e) {
            var reason = e && e.reason;
            var msg = (reason && (reason.message || String(reason))) || '';
            var stack = (reason && reason.stack) || '';
            if (noisy.test(msg) || stackHit.test(stack)) e.preventDefault();
          });

          var kill = function (el) {
            try { el.parentNode && el.parentNode.removeChild(el); } catch (_) {}
          };
          var sweep = function () {
            document.querySelectorAll(
              'vite-error-overlay, vite-plugin-checker-error-overlay'
            ).forEach(kill);
          };

          if (document.body) sweep();
          new MutationObserver(function (muts) {
            for (var i = 0; i < muts.length; i++) {
              var added = muts[i].addedNodes;
              for (var j = 0; j < added.length; j++) {
                var n = added[j];
                if (n.nodeType === 1) {
                  var tag = n.tagName && n.tagName.toLowerCase();
                  if (tag === 'vite-error-overlay' ||
                      tag === 'vite-plugin-checker-error-overlay') {
                    kill(n);
                  }
                }
              }
            }
          }).observe(document.documentElement, { childList: true, subtree: true });
        } catch (e) {}
      })();
    </script>

    <!-- Editorial is the canonical first-paint system. Load its native display
         faces here so Fraunces italic 400 is never browser-synthesized during
         baseline capture; runtime loading still supplies every alternate system. -->
    <link rel="stylesheet"
           href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,400&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" />
    <!-- Load the primary body face before first paint. Optional picker faces
         and non-default system faces are loaded on demand by the app. -->
    <!-- BUG-014: load the primary font stylesheet directly. The previous
         rel="preload" + inline onload="..." swap relied on an inline event
         handler, which a nonce-based CSP (no 'unsafe-inline') blocks — nonces
         do not cover inline event handlers. A plain stylesheet link needs no
         inline JS, works under strict CSP, and keeps display=swap for FOUT
         control. Same URL for all clients, so the old <noscript> duplicate is
         no longer needed. -->
    <link rel="stylesheet"
           href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />

    <div id="root"><!--app-html--></div>
    <script>
      // BUG-018 (run19): routes without server-injected content (admin,
      // noindex pages) used to show a blank black page until React mounted.
      // Paint a minimal skeleton ONLY when #root is empty — injected SSR
      // content (most public routes) already gives instant real content.
      // React's createRoot().render() replaces this on mount.
      (function () {
        try {
          var root = document.getElementById('root');
          if (!root || root.firstElementChild) return;
          root.innerHTML =
            '<div aria-hidden="true" style="min-height:100vh;background:#000;padding:40px 20px;max-width:960px;margin:0 auto">' +
            '<style>@keyframes bsk{0%{opacity:.35}50%{opacity:.7}100%{opacity:.35}}.bsk{background:#1a1a22;animation:bsk 1.4s ease-in-out infinite}</style>' +
            '<div class="bsk" style="height:2rem;width:60%;max-width:420px;margin-bottom:1rem"></div>' +
            '<div class="bsk" style="height:1rem;width:80%;max-width:640px;margin-bottom:2rem"></div>' +
            '<div class="bsk" style="height:8rem;width:100%;margin-bottom:1rem"></div>' +
            '<div class="bsk" style="height:8rem;width:100%;margin-bottom:1rem"></div>' +
            '<div class="bsk" style="height:8rem;width:100%"></div>' +
            '</div>';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // The Replit dev banner is a development-only convenience. Inject it only
      // on Replit/dev hosts so production (awesome.video) never requests it.
      (function () {
        try {
          var isDev = location.hostname.endsWith('.replit.dev') ||
                      location.hostname === 'localhost' ||
                      location.hostname.endsWith('.repl.co');
          if (!isDev) return;
          var s = document.createElement('script');
          s.type = 'text/javascript';
          s.src = 'https://replit.com/public/js/replit-dev-banner.js';
          document.body.appendChild(s);
        } catch (e) {}
      })();
    </script>
