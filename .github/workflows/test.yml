name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit
      env:
        NODE_ENV: 'test'
        DATABASE_URL: ${{ secrets.TEST_DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}

  webfont-fetch:
    # Hosted font sources (client/index.html pre-paint link + FONT_STYLESHEETS)
    # are only proven by asking the provider. Exit 1 = the provider rejected a
    # URL / family (defect, fails the build); exit 2 = transport/5xx outage
    # (inconclusive, warning only). The raw per-URL answers are kept either way.
    name: Hosted webfont fetch
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Probe hosted webfonts
      run: |
        set +e
        node scripts/validation/accent-drift.mjs --network --evidence=webfont-evidence/webfont-fetch.json
        code=$?
        if [ "$code" = "2" ]; then
          echo "::warning title=webfont-fetch inconclusive::font provider unreachable (transport/5xx); not a verdict on the URLs — rerun"
          exit 0
        fi
        exit $code

    - name: Upload webfont evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: webfont-fetch-evidence
        path: webfont-evidence/
        if-no-files-found: warn
        retention-days: 30

  design-system-artifact-deps:
    # The design-system preview artifact declares its own dependency set but is
    # locked through the root package-lock.json. Install that locked tree, audit
    # the artifact's transitive closure against the advisory DB (moderate+ fails
    # unless a reviewed, unexpired exception exists), and build the artifact.
    name: Design-system artifact dependency audit
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install locked tree
      run: npm ci

    - name: Audit artifact dependency closure
      run: |
        set +e
        node scripts/validation/artifact-dependency-audit.mjs --evidence=artifact-audit/advisories.json
        code=$?
        if [ "$code" = "2" ]; then
          echo "::warning title=artifact audit inconclusive::npm advisory service unreachable; rerun"
          exit 0
        fi
        exit $code

    - name: Build artifact
      run: npm run build --prefix artifacts/awesome-video-design-system

    - name: Upload advisory evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: design-system-artifact-advisories
        path: artifact-audit/
        if-no-files-found: warn
        retention-days: 30

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run database migrations
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test

    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: 'test'
        DATABASE_URL: postgresql://test:test@localhost:5432/test

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright browsers
      run: npx playwright install --with-deps

    - name: Run database migrations
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test

    - name: Run E2E tests
      run: npm run test:e2e
      env:
        NODE_ENV: 'test'
        DATABASE_URL: postgresql://test:test@localhost:5432/test
        CI: true

    - name: Upload Playwright report
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  test-coverage:
    name: Test Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run database migrations
      run: npm run db:push
      env:
        DATABASE_URL: postgresql://test:test@localhost:5432/test

    - name: Run tests with coverage
      run: npm run test:coverage
      env:
        NODE_ENV: 'test'
        DATABASE_URL: postgresql://test:test@localhost:5432/test

    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage/
        retention-days: 30
