name: Ops watch

# Every 15 minutes: run the scheduled jobs (the external cron of Decision 5, for
# when Autoscale has no instance up), read the app's own signals, probe the
# public site, and open or update one issue per breached signal. Issues are
# never closed here. Counts and timestamps only: nothing in an issue is PII.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-watch
  cancel-in-progress: false

env:
  SITE: https://awesome.video
  # An existing issue gets a new comment only if it was quiet for this long.
  COMMENT_EVERY_HOURS: "6"

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production
        env:
          OPS_CRON_TOKEN: ${{ secrets.OPS_CRON_TOKEN }}
        run: |
          set +x
          mkdir -p out
          if [ -n "$OPS_CRON_TOKEN" ]; then echo "::add-mask::$OPS_CRON_TOKEN"; fi
          auth=(-H "Authorization: Bearer $OPS_CRON_TOKEN")

          # D3: the external cron call (the app answers 200 only when it ran the jobs).
          curl -sS --max-time 240 -o out/jobs.json -w '%{http_code}\n' -X POST "${auth[@]}" "$SITE/api/ops/run-due-jobs" > out/jobs.code || echo 000 > out/jobs.code
          # W4b: the app's own signals.
          curl -sS --max-time 30 -o out/signals.json -w '%{http_code}\n' "${auth[@]}" "$SITE/api/ops/signals" > out/signals.code || echo 000 > out/signals.code

          # Tier 0. Ready is retried once so a single slow probe is not a breach.
          ready() { curl -sS --max-time 10 -o /dev/null -w '%{http_code}\n' "$SITE/api/health/ready" || echo 000; }
          code=$(ready); [ "$code" = 200 ] || { sleep 10; code=$(ready); }
          echo "$code" > out/ready.code
          curl -sS --max-time 15 -o /dev/null -w '%{http_code} %{time_total}\n' "$SITE/" > out/home.txt || echo "000 15" > out/home.txt
          curl -sS --max-time 10 "$SITE/api/version" | jq -r '.revision // "unknown"' > out/live.rev || echo unknown > out/live.rev
          git ls-remote "https://github.com/$GITHUB_REPOSITORY.git" refs/heads/main | cut -f1 > out/main.rev || echo unknown > out/main.rev
          echo "jobs=$(cat out/jobs.code) signals=$(cat out/signals.code) ready=$(cat out/ready.code) home=$(cat out/home.txt)"

      - name: Evaluate thresholds
        run: |
          # Writes out/breaches.jsonl: one {"signature","evidence"} object per line.
          b() { jq -nc --arg s "$1" --argjson e "$2" '{signature:$s, evidence:$e}' >> out/breaches.jsonl; }
          : > out/breaches.jsonl
          jobs=$(cat out/jobs.code); sig=$(cat out/signals.code); ready=$(cat out/ready.code)
          read -r home_code home_time < out/home.txt

          if [ "$jobs" = 503 ] || [ "$sig" = 503 ]; then
            b "OPS_CRON_TOKEN not configured in production" "{\"runDueJobs\":$jobs,\"signals\":$sig}"
          else
            [ "$jobs" = 200 ] || b "run-due-jobs did not return 200" "{\"status\":$jobs}"
            if [ "$sig" = 200 ]; then
              rev=$(jq -r .revision out/signals.json)
              recent=$(date -u -d "-20 minutes" +%Y-%m-%dT%H:%M:%S)
              # Only signatures seen in the last 20 minutes breach; older ones are history since boot.
              jq -c --arg recent "$recent" '.errorLogs.topSignatures[] | select(.count > 0 and .lastAt >= $recent)' out/signals.json | while read -r row; do
                sig_text=$(jq -r .signature <<<"$row")
                hash=$(printf '%s' "$sig_text" | sha256sum | cut -c1-8)
                b "${sig_text%%:*} $hash" "$(jq -c --arg r "$rev" '{count, lastAt, revision:$r}' <<<"$row")"
              done
              jq -e --arg recent "$recent" '.http5xx >= 3 and (.lastHttp5xxAt // "") >= $recent' out/signals.json >/dev/null && b "5xx responses" "$(jq -c '{http5xx, lastHttp5xxAt, bootAt, revision}' out/signals.json)"
              jq -e '.pool.waiting > 0' out/signals.json >/dev/null && b "database pool waiting" "$(jq -c '{pool, bootAt, revision}' out/signals.json)"
            else
              b "signals endpoint did not return 200" "{\"status\":$sig}"
            fi
          fi
          [ "$ready" = 200 ] || b "ready probe failing" "{\"status\":$ready}"
          if [ "$home_code" != 200 ] || awk -v t="$home_time" 'BEGIN { exit !(t > 5) }'; then
            b "homepage not 200 within 5 s" "{\"status\":$home_code,\"seconds\":$home_time}"
          fi

          # Info only: a mismatch right after a merge is normal until the deploy lands.
          {
            echo "### ops-watch"
            echo "- jobs $jobs, signals $sig, ready $ready, home $home_code in ${home_time}s"
            if [ "$(cat out/live.rev)" = "$(cat out/main.rev)" ]; then echo "- revision: live matches main ($(cut -c1-8 out/live.rev))"
            else echo "- revision (info): live $(cut -c1-8 out/live.rev), main $(cut -c1-8 out/main.rev)"; fi
            echo "- breaches: $(wc -l < out/breaches.jsonl)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -s out/breaches.jsonl ] || exit 0
          gh label create ops-watch --color B60205 --description "Opened by the ops-watch workflow" 2>/dev/null || true
          gh issue list --label ops-watch --state open --limit 200 --json number,title,updatedAt > out/open.json
          cutoff=$(date -u -d "-$COMMENT_EVERY_HOURS hours" +%Y-%m-%dT%H:%M:%SZ)
          created=0
          while read -r row; do
            title="[ops-watch] $(jq -r .signature <<<"$row")"
            body=$(printf 'Seen at %s (run %s/%s/actions/runs/%s).\n\nCounts and timestamps only. Full text: GET /api/ops/signals (token-gated).\n\n```json\n%s\n```\n' \
              "$(date -u +%FT%TZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$(jq .evidence <<<"$row")")
            found=$(jq -c --arg t "$title" '[.[] | select(.title == $t)][0] // empty' out/open.json)
            if [ -z "$found" ]; then
              [ "$created" -lt 5 ] || continue
              created=$((created + 1))
              gh issue create --title "$title" --label ops-watch --body "$body"
            elif [[ "$(jq -r .updatedAt <<<"$found")" < "$cutoff" ]]; then
              gh issue comment "$(jq -r .number <<<"$found")" --body "$body"
            fi
          done < out/breaches.jsonl
