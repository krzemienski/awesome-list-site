name: Deploy Awesome Video Viewer to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Generate static data
      run: npx tsx scripts/build-static.ts
      env:
        VITE_STATIC_BUILD: 'true'

    - name: Validate standalone design-system exceptions
      run: npm run validate:standalone-palette-drift
        
    - name: Build React application
      timeout-minutes: 20
      run: |
        # Optimize build environment for large React app
        export NODE_OPTIONS="--max-old-space-size=8192 --max-semi-space-size=2048"
        export VITE_BUILD_TARGET="github-pages"
        
        # Build with optimizations
        npm run build
      env:
        NODE_ENV: 'production'
        VITE_STATIC_BUILD: 'true'
        VITE_GA_MEASUREMENT_ID: ${{ secrets.GA_MEASUREMENT_ID }}
        VITE_SITE_TITLE: ${{ vars.SITE_TITLE || 'Awesome Video Dashboard' }}
        VITE_SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION || 'A curated collection of awesome video resources and tools' }}
        VITE_SITE_URL: ${{ vars.SITE_URL || 'https://krzemienski.github.io/awesome-list-site' }}
        VITE_DEFAULT_THEME: ${{ vars.DEFAULT_THEME || 'red' }}
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist/public'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout smoke validator
        uses: actions/checkout@v4

      - name: Setup Node.js for smoke validator
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install smoke validator dependencies
        run: npm ci --ignore-scripts

      - name: Install Chromium for analytics smoke
        run: npx playwright install chromium

      - name: Run production GA4 and INP smoke check
        id: analytics-smoke
        continue-on-error: true
        env:
          VG2_EVIDENCE_DIR: ${{ github.workspace }}/evidence/ga4-smoke
          VG2_RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
          VG2_EVIDENCE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLAYWRIGHT_CHROMIUM_EXECUTABLE: ${{ runner.tool_cache }}/Playwright/1.60.0/x64/chrome-linux/chrome
        run: |
          if [ ! -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" ]; then
            export PLAYWRIGHT_CHROMIUM_EXECUTABLE="$(find "$HOME/.cache/ms-playwright" -type f \( -path '*/chrome-linux/chrome' -o -path '*/chrome-linux64/chrome' \) -print -quit)"
          fi
          if [ -z "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" ] || [ ! -x "$PLAYWRIGHT_CHROMIUM_EXECUTABLE" ]; then
            echo "::error::Chromium was not installed; analytics smoke evidence cannot be collected."
            exit 1
          fi
          export PLAYWRIGHT_CHROMIUM_EXECUTABLE
          node scripts/vg2-ga4-validate.mjs --smoke --base-url "${{ steps.deployment.outputs.page_url }}"

      - name: Upload post-publish analytics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ga4-smoke-evidence-${{ github.run_id }}
          path: evidence/ga4-smoke
          if-no-files-found: error
          retention-days: 30

      - name: Surface analytics smoke failure
        if: steps.analytics-smoke.outcome == 'failure'
        run: |
          echo "::error::Post-publish GA4/INP smoke failed. The release remains published; download the ga4-smoke-evidence-${{ github.run_id }} artifact for assertion details."
          exit 1
