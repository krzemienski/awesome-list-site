# Awesome List Generator Configuration
# This file configures your self-hosted awesome list site

# Site Configuration
site:
  title: "Awesome Video Dashboard"
  description: "A curated collection of awesome video resources, tools, and technologies for developers and content creators"
  url: "https://krzemienski.github.io/awesome-list-site"
  author: "krzemienski"
  
# Source Configuration
source:
  # Primary awesome list to parse
  url: "https://raw.githubusercontent.com/krzemienski/awesome-video/master/README.md"
  # Auto-refresh interval in minutes (0 to disable)
  refresh_interval: 60
  # Additional lists for multi-list switching
  additional_lists:
    - name: "Awesome Go"
      url: "https://raw.githubusercontent.com/avelino/awesome-go/main/README.md"
      category: "Programming"
      icon: "🐹"
    - name: "Awesome Python"
      url: "https://raw.githubusercontent.com/vinta/awesome-python/master/README.md"
      category: "Programming"
      icon: "🐍"
    - name: "Awesome JavaScript"
      url: "https://raw.githubusercontent.com/sorrycc/awesome-javascript/master/README.md"
      category: "Programming"
      icon: "💛"

# Theme Configuration
theme:
  # Default theme: light, dark, or auto
  default: "auto"
  # Primary color scheme
  primary_color: "#dc2626" # Dark red
  # Custom themes
  custom_themes:
    - name: "Ocean"
      primary: "#0ea5e9"
      secondary: "#0284c7"
      background: "#f8fafc"
    - name: "Forest"
      primary: "#059669"
      secondary: "#047857"
      background: "#f0fdf4"

# Analytics Configuration
analytics:
  # Google Analytics 4 Measurement ID
  google_analytics: "G-383541848"
  # Track these events
  events:
    - resource_clicks
    - category_views
    - search_queries
    - theme_changes
    - list_switches
  # Privacy settings
  anonymize_ip: true
  cookie_consent: true

# Features Configuration
features:
  # Enable/disable specific features
  search: true
  categories: true
  analytics_dashboard: true
  theme_switcher: true
  list_switcher: true
  resource_previews: true
  # Pagination settings
  pagination: true
  items_per_page: 24
  page_size_options: [12, 24, 48, 96]
  # Default layout configuration
  default_layout: "list"  # Options: "cards", "list", "compact"
  allow_layout_switching: true
  # AI-powered features (requires Anthropic API key)
  ai_tags: true
  ai_descriptions: true

# Build Configuration
build:
  # Output directory for static builds
  output_dir: "dist"
  # Base URL for static deployment
  base_url: "/"
  # Generate sitemap
  sitemap: true
  # Generate RSS feed
  rss_feed: true

# Deployment Configuration
deploy:
  # Deployment method: github-pages, vercel, netlify, manual
  method: "github-pages"
  # Custom domain (optional)
  custom_domain: ""
  # GitHub Pages specific settings
  github:
    repository: "krzemienski/awesome-list-site"
    branch: "gh-pages"
    cname: ""

# SEO Configuration
seo:
  # Meta tags
  keywords: "awesome, curated, list, self-hosted, open-source"
  # Open Graph settings
  og_image: "https://awesome-selfhosted.net/og-image.png"
  # Twitter Card settings
  twitter_card: "summary_large_image"
  twitter_site: "@awesome_sh"

# Performance Configuration
performance:
  # Enable service worker for offline support
  service_worker: true
  # Cache duration in seconds
  cache_duration: 3600
  # Lazy load images
  lazy_loading: true

# Resource Kinds Configuration
# A stored resource kind always wins. When a resource has no stored kind, the
# read-time resolver infers one from its tags using these mappings (merged with
# the generic defaults in shared/resourceKinds.ts), then from its category /
# subcategory / sub-subcategory name using category_mappings (no generic
# defaults), and finally falls back to "other". Words are matched after
# normalisation (NFKC, lowercase, whitespace/underscores → "-").
resource_kinds:
  tag_mappings:
    tools: []
    libraries: []
    standards: []
    events: []
    protocols: []
  category_mappings:
    tools: []
    libraries: []
    standards: []
    events: []
    protocols: []

# Contact Configuration
# Destinations for the contact variants. Every destination is unavailable until
# configured. The in-app form endpoint is enabled ONLY by the CONTACT_ENABLED=true
# environment variable; it cannot be switched on from this file.
contact:
  # mailto: address, e.g. "mailto:hello@example.com" (empty = unavailable)
  email: ""
  # https: issue tracker (empty = unavailable; never derived from source.url)
  issues_url: ""
  # https: discussions destination; only offered when discussions_verified is true
  discussions_url: ""
  discussions_verified: false
  # Days to keep contact submissions; consumed by purgeExpiredContactSubmissions(),
  # which is not scheduled yet (see docs/CONTACT-VARIANTS.md "Backend")
  retention_days: 180
