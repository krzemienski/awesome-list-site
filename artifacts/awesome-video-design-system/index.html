<!doctype html>
<html lang="en" data-product-profile="standalone-exports" data-system="editorial" data-accent="crimson">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="The canonical federated design system for Awesome.Video." />
    <title>Awesome.Video Design System</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The one canonical request used by the live app and frozen design shell.
         Keeping the href byte-identical preserves the same families, weights,
         styles, axes, and underlying font files in every artifact view. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <script>
      (() => {
        const registry = __AWESOME_VIDEO_DS_BOOT__;
        try {
          // Keep parser-blocking boot semantics identical to useShowcaseTheme:
          // only a complete, valid combined record can override both defaults.
          let saved = null;
          try { saved = JSON.parse(localStorage.getItem("awesome-video-design-system:theme") || "null"); } catch {}
          const valid = saved && typeof saved === "object" && !Array.isArray(saved)
            && typeof saved.system === "string" && registry.systems.includes(saved.system)
            && typeof saved.accent === "string" && registry.accents.includes(saved.accent);
          const system = valid ? saved.system : registry.defaultSystem;
          const accent = valid ? saved.accent : registry.defaultAccent;
          document.documentElement.dataset.system = registry.systems.includes(system)
            ? system
            : registry.defaultSystem;
          document.documentElement.dataset.accent = registry.accents.includes(accent)
            ? accent
            : registry.defaultAccent;
        } catch {
          document.documentElement.dataset.system = registry.defaultSystem;
          document.documentElement.dataset.accent = registry.defaultAccent;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
